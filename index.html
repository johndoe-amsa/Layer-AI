<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Anti-flash : pose le thème avant le chargement du bundle, avec la
      // même logique que applyTheme (src/lib/settings.ts).
      (function () {
        var theme = "system";
        try {
          theme = JSON.parse(localStorage.getItem("layer-ai-settings")).theme || "system";
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Layer AI</title>

    <!-- Police embarquée (voir @font-face dans src/styles.css) : la précharger
         lance son téléchargement sans attendre l'analyse de la feuille de
         style, ce qui évite en pratique de voir le texte s'afficher d'abord
         dans la police du système. Seul le sous-ensemble latin est préchargé —
         latin-ext n'est tiré que si un texte le réclame. `crossorigin` est
         obligatoire pour les polices, même servies depuis la même origine. -->
    <link
      rel="preload"
      href="/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- PWA / écran d'accueil iPhone. Ces balises sont ignorées par le
         webview Tauri (.exe) : elles ne servent que dans un navigateur. -->
    <meta name="description" content="Mini assistant LLM : corriger, traduire ou reformuler un texte." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS : ouvre en plein écran « app » depuis l'écran d'accueil. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Layer AI" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-256.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
